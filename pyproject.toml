[project]
name = "mosaic-compose"
version = "0.0.0"
description = "MOSAIC — composition layer coupling metabolic, microbiome-community, PKPD, and agent-based models through hormone homeostasis"
requires-python = ">=3.11"
dependencies = [
    "process-bigraph",
    "bigraph-schema",
    # viva-cobra — COBRApy dynamic-FBA components for the metabolic-arm composites.
    "viva-cobra @ git+https://github.com/vivarium-collective/viva-cobra.git@main",
    "bigraph-viz>=2.0.3",
    "pyyaml>=6.0",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "matplotlib",
    "plotly",
    # Web-based workspace dashboard (server + templates + assets + lib helpers).
    # Extracted from viva-template as of v0.4.16; provides the `vivarium-workbench
    # serve` CLI invoked by scripts/serve.sh.
    "vivarium-workbench",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# MOSAIC Foundations — the capabilities-showcase investigation imports real
# ecosystem simulators, one per model type, so the demo spans the variety the
# framework supports. Kept as an optional extra (not base deps) so the standard
# publish/CI install stays light; the Foundations studies + the publish job that
# renders them install `.[foundations]`.
foundations = [
    # ODE / kinetic — Stein-2013 gLV community + estrogen enterohepatic PK (Antimony/SBML).
    # Python-gated to >=3.12: viva-tellurium depends on libroadrunner>=2.11, which
    # ships no 3.11 wheels (cp312+ only). The workspace still supports 3.11 (see the
    # note below), so the marker excludes the tellurium arm from a 3.11 resolution
    # (keeps `uv sync`/CI green on 3.11) while the publish job (3.12) installs it.
    "viva-tellurium @ git+https://github.com/vivarium-collective/viva-tellurium.git@main ; python_version >= '3.12'",
    # Spatial / ABM — pymunk particle biofilm colony.
    "viva-munk @ git+https://github.com/vivarium-collective/viva-munk.git@main",
    # NOTE: viva-cpm (Cellular-Potts crypt) and vivarium-tyssue (vertex sheet) are
    # intentionally NOT in this extra. Both are blocked prototypes, not used by any
    # live study, and each breaks dependency resolution: viva-cpm requires Python
    # >=3.12 (workspace supports >=3.11), and vivarium-tyssue pins the old
    # `vivarium-dashboard` URL which conflicts with this workspace's
    # `vivarium-workbench`. Re-add them (with a Python marker / URL override) when
    # those arms are unblocked upstream — see composites/crypt.py.
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Allow ecosystem git-direct-reference deps (viva-superpowers / vivarium-workbench
# @ git+https://…) that workspaces commonly add — hatchling rejects them otherwise.
[tool.hatch.metadata]
allow-direct-references = true

# Declare the workspace Python package explicitly so this workspace is
# pip-installable (e.g. `pip install git+<repo>@<sha>`).  sms-api injects it
# as an extra_pip_dep so the container runner can import the workspace's
# processes from a committed + pushed git ref.
[tool.hatch.build.targets.wheel]
packages = ["mosaic_compose"]

[tool.uv.sources]
vivarium-workbench = { git = "https://github.com/vivarium-collective/vivarium-workbench.git", branch = "main" }
