[project]
name = "mosaic-compose"
version = "0.1.0"
description = "MOSAIC investigation workspace — composition studies coupling metabolic, microbiome-community, PKPD, and agent-based models. The composition layer (simulator) lives in mosaic-compose-sim, pinned per study for reproducibility."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    # The composition layer (simulator): composites, inline models, visualizations.
    # Pinned by git tag (see [tool.uv.sources]) so every study runs against this
    # exact version; each study.yaml also records the pin under `simulator:`. Brings
    # process-bigraph, bigraph-schema, viva-cobra, plotly, etc. transitively.
    "mosaic-compose-sim",
    # Workbench dashboard (serve/publish) + report tooling used by the WORKSPACE.
    "vivarium-workbench",
    "pyyaml>=6.0",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# MOSAIC Foundations — the capabilities-showcase investigation imports real
# ecosystem simulators, one per model type, so the demo spans the variety the
# framework supports. Kept as an optional extra (not base deps) so the standard
# publish/CI install stays light; the Foundations studies + the publish job that
# renders them install `.[foundations]`.
foundations = [
    # The ODE (viva-tellurium, py>=3.12) + ABM (viva-munk) backing-sim arms, via
    # the simulator's own [foundations] extra. The git sources for them are kept
    # in this repo's [tool.uv.sources] below, since uv sources do not propagate
    # through a git dependency. (viva-cpm / vivarium-tyssue remain intentionally
    # excluded — blocked prototypes; see the sim's composites/crypt.py.)
    "mosaic-compose-sim[foundations]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Allow ecosystem git-direct-reference deps (viva-superpowers / vivarium-workbench
# @ git+https://…) that workspaces commonly add — hatchling rejects them otherwise.
[tool.hatch.metadata]
allow-direct-references = true

# Metadata-only wheel: the composition package (mosaic_compose) now lives in its
# own distribution (mosaic-compose-sim). This repo is the investigation workspace
# and ships no importable package of its own.
# NOTE: remote runners (sms-api) that previously injected mosaic_compose from this
# repo's git ref should now inject mosaic-compose-sim.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.uv.sources]
# The composition layer, pinned by git tag for reproducibility.
mosaic-compose-sim = { git = "https://github.com/vivarium-collective/mosaic-compose-sim.git", tag = "0.1.0" }
# Backing-sim git sources — declared here so mosaic-compose-sim's deps + its
# [foundations] extra resolve (uv [tool.uv.sources] are top-level-only and do not
# propagate through a git dependency).
viva-cobra = { git = "https://github.com/vivarium-collective/viva-cobra.git", branch = "main" }
viva-tellurium = { git = "https://github.com/vivarium-collective/viva-tellurium.git", branch = "main" }
viva-munk = { git = "https://github.com/vivarium-collective/viva-munk.git", branch = "main" }
vivarium-workbench = { git = "https://github.com/vivarium-collective/vivarium-workbench.git", branch = "main" }
