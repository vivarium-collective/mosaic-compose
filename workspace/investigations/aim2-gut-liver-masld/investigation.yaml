schema_version: 2
name: aim2-gut-liver-masld
title: Aim 2 — Gut–Liver Host–Microbiome Metabolism (MASLD)
created: '2026-10-02'
status: planning
question: Can an integrated, sex-specific model of gut–liver host–microbiome metabolism under hormonal
  regulatory control predict drug-processing pathways and therapeutic response in metabolic dysfunction-associated
  steatotic liver disease (MASLD)?
hypothesis: Hormone-regulated hepatic metabolism, represented as male and female genome-scale liver models
  coupled to community metabolic models of the gut microbiome and parameterized with sex-specific transcriptomic,
  metabolomic, and metagenomic data, will reproduce reported sex differences in the efficacy of resmetirom
  and GLP-1 receptor agonists via hormone-dependent shifts in hepatic lipogenesis, fatty-acid oxidation,
  and the gut–liver–microbiome axis.
description: 'MASLD affects nearly 100 million people in the US; nearly half of affected individuals are
  women, with marked differences between pre- and post-menopausal populations. It emerges from a complex
  interplay between liver metabolism, gut microbial ecology, immune response, and hormone regulation,
  with perturbations in one subsystem propagating across scales.


  This investigation builds Aim 2 of MOSAIC: a multi-compartment framework coupling genome-scale representations
  of male and female hepatic metabolism (Human1-derived, ftINIT-contextualized) with community metabolic
  models of the gut microbiome (Klebsiella, Escherichia, Streptococcus, Faecalibacterium, Roseburia).
  The Khetani-lab 3D liver microtissues and the gut–liver Transwell model are the in vitro testbeds. Demonstration
  therapeutics: resmetirom (a thyroid hormone receptor-beta agonist) and GLP-1 receptor agonists (e.g.
  semaglutide), both with documented sex-dependent responses.'
executive:
  what_is_this: Aim 2 of MOSAIC — a planned sex-specific, hormone-regulated model of gut–liver host–microbiome
    metabolism for predicting MASLD therapeutic response.
  verdict: Planned — scoping member studies; no models wired yet.
  verdict_status: planning
  decisions_needed:
  - question: Male vs. female liver GEM differentiation strategy?
    context: Prior Papin-lab work found sex-specific pentose-phosphate differences; decide how hormone
      state re-parameterizes the Human1-derived models.
  - question: Which gut community members and datasets anchor Aim 2?
    context: Candidate species above; candidate data include BARICO (PRJNA1051582), HMP1-II, BIO-ML, and
      MASLD multi-omics cohorts.
scientific_argument:
  main_claim: A sex-specific, hormone-regulated gut–liver model can predict MASLD drug-processing and
    therapeutic response, including documented sex differences for resmetirom and GLP-1 RAs.
  evidence_for:
  - Papin-lab sex-specific liver GEMs reveal distinct metabolic variation (e.g. pentose-phosphate pathway)
    between male and female models.
  - GLP-1 RA and resmetirom responses in MASLD/MASH show reported sex-dependent differences.
  - The gut–liver–microbiome axis is an established mediator of hepatic lipid handling.
  evidence_against:
  - No published gut-epithelial transcriptomics in BV or MASLD yet; some host inputs must be inferred
    or generated.
  - Linking macro-scale community dynamics to GEM flux bounds across the gut–liver seam is methodologically
    hard.
  key_figures: []
  caveats:
  - Initial scope centers on estrogen; androgen/thyroid axes modulate MASLD and are deferred.
  - Sex-specific parameterization depends on the availability of paired multi-omic data.
biological_story: 'The liver is a sexually dimorphic metabolic organ, and MASLD is shaped by how the estrogen,
  androgen, and thyroid axes tune hepatic lipogenesis, fatty-acid oxidation, and fibrogenesis. The gut
  microbiome feeds this system: microbial metabolites and microbial deconjugation of hormones influence
  what reaches the liver, while hormones in turn reshape hepatic metabolism and the gut epithelium. MOSAIC
  Aim 2 couples male and female genome-scale liver models to community metabolic models of the gut microbiome,
  with a PKPD compartment carrying the hormone and drug state. The aim is to predict, mechanistically,
  why a drug such as resmetirom or a GLP-1 RA changes liver metabolism differently in high- versus low-estrogen
  contexts, with those changes propagating out to the gut community through altered metabolite exchange.'
