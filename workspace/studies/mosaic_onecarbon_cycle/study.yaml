report:
  title: Kim 2021 one-carbon cycle
  verdict: supported
  confidence: medium
  evidence_quality: faithful-recreation
  objective: Test whether estradiol activation of CBS over the menstrual cycle makes hepatic homocysteine vary inversely with estradiol, reproducing Kim, Nijhout & Reed 2021.
  conclusion: Yes — homocysteine tracks estradiol inversely (corr ≈ -0.94), lowest at the ovulatory E2 peak, built on the curated Reed2004 methionine-cycle SBML plus Kim's exact h(E2) CBS forcing. This is a faithful recreation of the paper's headline (Fig 2), not a de-novo fit.
  main_insight: The whole menstrual-cycle homocysteine swing follows from a single estradiol target (CBS); the methionine cycle's other fluxes re-balance to keep the SAM/SAH methylation ratio stable.
  caveat: "Methionine-cycle core only (folate pools clamped); Kim's PEMT g(E2) and TS/DHFR u(E2) effects act on folate-cycle enzymes not represented here. E2(t) is a 5-harmonic Fourier fit (peak slightly damped, 1.02 vs 1.15 nM)."
  key_metrics:
  - {name: corr(E2, Hcy): null, value: -0.94, units: dimensionless}
  - {name: Hcy at ovulatory peak, value: 0.60, units: µM}
  - {name: Hcy at menstruation, value: 1.03, units: µM}
conclusion: Estradiol activation of CBS makes hepatic homocysteine vary inversely with estradiol over the menstrual cycle (corr ≈ -0.94), lowest at the ovulatory E2 peak — a faithful recreation of Kim, Nijhout & Reed 2021 on the curated Reed2004 methionine-cycle model.
