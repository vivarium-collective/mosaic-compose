findings:
- id: bistable-amine-loop
  kind: biological
  status: confirms
  statement: The biogenic-amine cross-feeding ODE is bistable — a protective acidic Lactobacillus attractor and a Gardnerella-dominant BV attractor with a ~mM amine pool — reproducing the two-way loop Borgogna 2021 and Puebla-Barragan 2021 quantify.
  evidence:
    from_run: baseline
    from_test: lactobacillus_protective_dominance
    observed: 'protective basin: Lactobacillus → ~0.94, Gardnerella → ~0.09, amines cleared to ~0.1 mM, pH → 4.3; dysbiotic start instead locks into G-dominant, ~5.4 mM amines, pH 5.8'
    units: relative abundance
    divergence_factor: 0.0
  expected:
    summary: Borgogna 2021 + Puebla-Barragan 2021 imply a two-way amine loop that should admit both a protective and a BV steady state.
    range:
    - 0.6
    - 1.0
    cites:
    - borgogna2021biogenicamines
    - pueblabarragan2021malodour
  explanation: Amines inhibit Lactobacillus growth and suppress lactate (raising pH, favouring Gardnerella); Lactobacillus degrades amines and acidifies (lowering pH, favouring itself). The opposing feedbacks create two basins of attraction.
  provenance:
    run_ids:
    - mosaic_compose.composites.crossfeeding.mosaic_amine_crossfeeding__1795275245__f4b22d
    model_version: mv:a06eaf3be2e67984
- id: amine-clearance-mechanism
  kind: biological
  status: confirms
  statement: In the protective basin Lactobacillus clears the biogenic-amine pool and acidifies the community, closing the amine-degradation arm of the loop.
  evidence:
    from_run: baseline
    from_test: amine_pool_subthreshold
    observed: amine pool falls from 2000 µM toward ~0.1 mM as Lactobacillus takes over; lactate proxy rises to ~1.6 (pH ~4.3)
    divergence_factor: 0.0
  expected:
    summary: Puebla-Barragan 2021 — Lactobacillus crispatus strains degrade putrescine/cadaverine and grow faster at low pH.
    range:
    - 0.0
    - 2000.0
    cites:
    - borgogna2021biogenicamines
  provenance:
    run_ids:
    - mosaic_compose.composites.crossfeeding.mosaic_amine_crossfeeding__1795275245__f4b22d
    model_version: mv:a06eaf3be2e67984
report:
  title: BV biogenic-amine cross-feeding
  verdict: supported
  confidence: medium
  evidence_quality: illustrative-mechanistic
  objective: Test whether a biogenic-amine cross-feeding loop coupling the Lactobacillus–Gardnerella community to the amine pool and pH reproduces bistable healthy/BV states.
  conclusion: The ODE is bistable as the amine data imply. The amine growth-inhibition half-constant is anchored to Borgogna 2021's measured effect size; the community/pH scaffold is illustrative (not calibrated to a clinical dataset), so the verdict is a mechanistic-plausibility result, not a quantitative fit.
  main_insight: Biogenic amines are not just a BV marker — as a cross-fed metabolite coupled to pH they are a bistability-generating mechanism, which reframes them as a therapeutic target (an amine-degrading probiotic shifts the basin boundary).
  caveat: "Single illustrative parameterisation; the bistability is demonstrated, not mapped as a calibrated phase boundary. No clinical time-series fit yet (candidate data — Song 2020 PRJNA637322)."
  key_metrics:
  - {name: Lactobacillus (protective, mean): null, value: 0.74, units: relative abundance}
  - {name: amine pool (mean), value: 828, units: µM}
  - {name: 'pH (protective, final)', value: 4.3, units: pH}
conclusion: A biogenic-amine cross-feeding loop makes the vaginal community bistable; the protective basin clears amines and acidifies, the BV basin sustains a ~mM amine pool at higher pH.
